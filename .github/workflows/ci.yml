name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse tracked family data
        shell: bash
        run: |
          if git ls-files 'data/*.ged' 'data/*.sqlite*' 'data/curated/*' 'data/research_archive/*' | grep -q .; then
            echo "Family data must remain outside Git."
            exit 1
          fi
          if git ls-files 'app/profiles/*.py' | grep -v -E '^app/profiles/(__init__|example)\.py$' | grep -q .; then
            echo "Only the example site profile may be tracked."
            exit 1
          fi

      - name: Compile application
        run: python -m compileall app

      - name: Run tests
        run: python -m unittest discover -s tests -v
